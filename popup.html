<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 220px;
      padding: 20px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      text-align: center;
      background: #fafafa;
    }
    .logo {
      width: 48px; height: 48px; margin: 0 auto 12px;
      border-radius: 12px;
      background: linear-gradient(135deg, #2196f3, #3f51b5);
      display: flex; align-items: center; justify-content: center;
      color: white; font-size: 24px; font-weight: bold;
    }
    h1 { font-size: 18px; color: #333; margin-bottom: 4px; }
    .subtitle { font-size: 12px; color: #888; margin-bottom: 20px; }
    .icon { font-size: 36px; margin-bottom: 8px; }
    .title { font-size: 16px; font-weight: 600; color: #444; margin-bottom: 6px; }
    .desc { font-size: 12px; color: #888; line-height: 1.5; }
    .detail { font-size: 11px; color: #aaa; margin-top: 8px; word-break: break-all; }
    .refresh-btn {
      margin-top: 14px; padding: 6px 20px; border: 1px solid #ccc;
      border-radius: 6px; background: white; cursor: pointer; font-size: 12px; color: #555;
    }
    .refresh-btn:active { background: #f0f0f0; }
    .hint { font-size: 11px; color: #999; margin-top: 10px; line-height: 1.5; }
    #statusIndicator {
      padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600;
      margin-bottom: 16px;
    }
    .status-ok { background: #e8f5e9; color: #2e7d32; }
    .status-no { background: #fce4ec; color: #c62828; }
  </style>
</head>
<body>
  <div class="logo">S</div>
  <h1>SmarTest</h1>
  <div class="subtitle">Extension</div>

  <div id="statusIndicator" class="status-no">Checking...</div>

  <div class="icon" id="authIcon">🔒</div>
  <div class="title" id="authTitle">Not authorized</div>
  <div class="desc" id="authDesc">No session detected.</div>
  <div class="detail" id="authDetail"></div>

  <button id="refreshBtn" class="refresh-btn">🔄 Refresh</button>
  <div class="hint" id="hint"></div>

  <script src="popup.js"></script>
</body>
</html>
